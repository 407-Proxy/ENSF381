<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ice Cream Shop</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <header>
      <img src="logo.jpeg" alt="Shop Logo" width="100" />
      <h1>Sweet Scoop Ice Cream</h1>
    </header>

    <div>
      <nav>
        <a href="index.html">Home</a> |
        <a href="menu_view.html">Menu</a>
      </nav>
    </div>

    <main>
      <h2 id="timer-display">Order Time Left: 10:00</h2>

      <form>
        <img src="Picture2.jpeg" width="250" height="auto" alt="Ice cream" />

        <h2>Vanilla Dream</h2>
        <h3>Choose Type</h3>

        <input type="radio" id="cup" name="type" value="cup" />
        <label for="cup">Cup</label><br />

        <input type="radio" id="cone" name="type" value="cone" />
        <label for="cone">Cone</label><br /><br />

        <button type="button" onclick="submitType()">Submit Selection</button>

        <h2>Chocolate Bliss</h2>
        <h3>Select Toppings</h3>

        <input type="checkbox" id="sprinkles" name="toppings" value="sprinkles" />
        <label for="sprinkles">Sprinkles</label><br />

        <input type="checkbox" id="nuts" name="toppings" value="nuts" />
        <label for="nuts">Nuts</label><br />

        <input type="checkbox" id="caramel" name="toppings" value="caramel" />
        <label for="caramel">Caramel</label><br /><br />

        <button type="button" onclick="submitToppings()">Submit Selection</button>

        <p id="price-tag">Total Price: $0.00</p>

        <button type="button" class="finish-order" onclick="finishOrder()">
          Finish Order
        </button>
      </form>
    </main>

    <footer>
      <p>&copy; 2026 Sweet Scoop Ice Cream. All rights reserved.</p>
    </footer>

    <script>
      let timerInterval;
      let timeRemaining = 600;

      function startTimer() {
        clearInterval(timerInterval);

        const displayElement = document.getElementById("timer-display");
        updateDisplay(timeRemaining, displayElement);

        timerInterval = setInterval(() => {
          timeRemaining--;
          updateDisplay(timeRemaining, displayElement);

          if (timeRemaining <= 0) {
            clearInterval(timerInterval);
            window.location.href = "order_summary.html";
          }
        }, 1000);
      }

      function updateDisplay(time, element) {
        const minutes = Math.floor(time / 60);
        let seconds = time % 60;

        seconds = seconds < 10 ? "0" + seconds : seconds;
        element.textContent = `Order Time Left: ${minutes}:${seconds}`;
      }

      function validateType() {
        const cup = document.getElementById("cup");
        const cone = document.getElementById("cone");

        if (!cup.checked && !cone.checked) {
          alert("Please select a type.");
          return false;
        }

        return true;
      }

      function validateToppings() {
        const sprinkles = document.getElementById("sprinkles");
        const nuts = document.getElementById("nuts");
        const caramel = document.getElementById("caramel");

        if (!sprinkles.checked && !nuts.checked && !caramel.checked) {
          alert("Please select at least one topping.");
          return false;
        }

        return true;
      }

      function calculatePrice() {
        const cup = document.getElementById("cup");
        const cone = document.getElementById("cone");
        const sprinkles = document.getElementById("sprinkles");
        const nuts = document.getElementById("nuts");
        const caramel = document.getElementById("caramel");

        let price = 0;

        if (cup.checked || cone.checked) {
          price += 6.00;
        }

        if (sprinkles.checked) price += 1.50;
        if (nuts.checked) price += 1.50;
        if (caramel.checked) price += 1.50;

        return price;
      }

      function updatePriceTag() {
        const priceTag = document.getElementById("price-tag");
        const price = calculatePrice();
        priceTag.textContent = `Total Price: $${price.toFixed(2)}`;
      }

      function submitType() {
        if (validateType()) {
          updatePriceTag();
        }
      }

      function submitToppings() {
        if (validateToppings()) {
          updatePriceTag();
        }
      }

      function finishOrder() {
        if (!validateType()) {
          return;
        }

        if (!validateToppings()) {
          return;
        }

        updatePriceTag();
        window.location.href = "order_summary.html";
      }

      startTimer();
    </script>
  </body>
</html>
